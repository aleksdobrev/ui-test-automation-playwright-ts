name: Testomatio Tests

on:
  workflow_dispatch:
    inputs:
      grep:
        description: 'tests to grep '
        required: false
        default: ''
      run:
        required: false
      testomatio:
        required: false

jobs:
  test:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps
      - run: |
          grep_pattern=$(printf '%s' "$TESTOMATIO_GREP" | sed 's/|/|@/g')
          [[ -n "$grep_pattern" ]] && grep_pattern="@$grep_pattern"
          printf 'Running Playwright grep pattern: %s\n' "$grep_pattern"
          npx playwright test --workers=1 --project=chromium --grep "$grep_pattern"
        env:
          TESTOMATIO_GREP: '${{ github.event.inputs.grep }}'
          TESTOMATIO: '${{ github.event.inputs.testomatio }}'
          TESTOMATIO_RUN: '${{ github.event.inputs.run }}'
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 10
